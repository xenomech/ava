packages:
  - frontend/apps/*
  - frontend/packages/*

allowBuilds:
  esbuild: true
  sharp: true

# Every third-party version lives here and is referenced as "catalog:" from the
# package that needs it. Grouped by the families that must move together.
catalog:
  # react
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # tanstack router
  "@tanstack/react-router": ^1.170.18
  "@tanstack/react-router-devtools": ^1.167.0
  "@tanstack/router-plugin": ^1.168.23

  # vite
  vite: ^8.1.5
  "@vitejs/plugin-react": ^6.0.4
  vite-plugin-pwa: ^1.3.0
  "@vite-pwa/assets-generator": ^1.0.2

  # tailwind
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.24
  tw-animate-css: ^1.4.0

  # design system
  shadcn: ^4.16.0
  "@base-ui/react": ^1.6.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.31.0
  next-themes: ^0.4.6
  sonner: ^2.0.7

  # runtime + validation
  zod: ^4.4.3
  "@t3-oss/env-core": ^0.13.11

  # toolchain
  typescript: ^6.0.3
  "@types/node": ^22.20.1
  turbo: ^2.10.7
  oxlint: ^1.76.0
  oxfmt: ^0.61.0
