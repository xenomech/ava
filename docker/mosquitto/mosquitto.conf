# Global settings come first: anything after a listener line binds to that listener instead.
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
# Kept beside the persistence data because Railway mounts one volume per service, which would hide this file.
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plaintext, for a private network only: clients refuse this port over the public internet.
listener 1883

# The entrypoint writes the encrypted listeners here, since mosquitto will not start on missing certificates.
include_dir /mosquitto/data/conf.d
