listener 1883

allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
# Alongside the persistence data rather than next to this file. Everything the
# broker writes has to live under one directory: Railway attaches a single
# volume per service, and mounting it over /mosquitto/config would hide this
# config file along with it.
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout
