name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: api

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go install mvdan.cc/gofumpt@latest
      - name: Check formatting
        working-directory: api
        run: |
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go build ./...
        working-directory: api

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go vet ./...
        working-directory: api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: go test ./...
        working-directory: api

  boundary:
    name: Module boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Hub builds without the workspace
        working-directory: hub
        run: GOWORK=off go build ./...
      - name: Hub does not depend on api
        working-directory: hub
        run: |
          if go list -deps ./... | grep -q '^ava/api'; then
            echo "hub must not import api"
            exit 1
          fi
      - name: Api does not depend on hub
        working-directory: api
        run: |
          if go list -deps ./... | grep -q '^ava/hub'; then
            echo "api must not import hub"
            exit 1
          fi

  hub:
    name: Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
      - run: go vet ./...
        working-directory: hub
      - run: go test ./...
        working-directory: hub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: hub

  hub-build:
    name: Hub build
    needs: hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o dist/avahub-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/avahub
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: avahub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hub/dist/avahub-${{ matrix.goos }}-${{ matrix.goarch }}

