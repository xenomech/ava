name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend/services/api

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - run: go install mvdan.cc/gofumpt@latest
      - name: Check formatting
        working-directory: backend/services/api
        run: |
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - run: go build ./...
        working-directory: backend/services/api

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - run: go vet ./...
        working-directory: backend/services/api

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - run: go test ./...
        working-directory: backend/services/api

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/pkg/go.mod
      - run: go vet ./...
        working-directory: backend/pkg
      - run: go test ./...
        working-directory: backend/pkg
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend/pkg

  boundary:
    name: Module boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/api/go.mod
      - name: Hub builds without the workspace
        working-directory: backend/services/hub
        run: GOWORK=off go build ./...
      - name: Hub does not depend on api
        working-directory: backend/services/hub
        run: |
          if go list -deps ./... | grep -q '^ava/api'; then
            echo "hub must not import api"
            exit 1
          fi
      - name: Packages depend on neither service
        working-directory: backend/pkg
        run: |
          if go list -deps ./... | grep -qE '^ava/(api|hub)'; then
            echo "packages must not import a service"
            exit 1
          fi
      - name: Api does not depend on hub
        working-directory: backend/services/api
        run: |
          if go list -deps ./... | grep -q '^ava/hub'; then
            echo "api must not import hub"
            exit 1
          fi

  hub:
    name: Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/hub/go.mod
      - run: go vet ./...
        working-directory: backend/services/hub
      - run: go test ./...
        working-directory: backend/services/hub
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend/services/hub

  hub-build:
    name: Hub build
    needs: hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/services/hub/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: backend/services/hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o dist/avahub-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/avahub
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: avahub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/services/hub/dist/avahub-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm oxlint

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: frontend
        run: pnpm -F web build
      - name: Type check (needs routeTree.gen.ts, which the build generates)
        working-directory: frontend
        run: pnpm check-types
