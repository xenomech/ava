version: "2"

linters:
  enable:
    - revive
    - gocritic
    - errname
    - predeclared
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - nilerr
    - nilnil
    - gosec
    - gocognit
    - cyclop

  settings:
    gocognit:
      min-complexity: 30
    cyclop:
      max-complexity: 15
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
    staticcheck:
      checks:
        - all
        - -ST1000
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - gocritic
      - path: internal/model/token\.go
        text: G101
        linters:
          - gosec
      - path: internal/state/state\.go
        text: G117
        linters:
          - gosec
      - path: external/tuya/discover\.go
        text: G101|G401|G501
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: ava
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
