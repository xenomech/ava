pre-commit:
  parallel: true
  jobs:
    - name: api-lint
      glob: "backend/services/api/**/*.go"
      run: cd backend/services/api && golangci-lint run

    - name: api-fmt
      glob: "backend/services/api/**/*.go"
      run: cd backend/services/api && test -z "$(gofumpt -l .)" || (echo "Run 'make fmt' to format code" && exit 1)

    - name: api-vet
      glob: "backend/services/api/**/*.go"
      run: cd backend/services/api && go vet ./...

    - name: api-test
      glob: "backend/services/api/**/*.go"
      run: cd backend/services/api && go test ./...

    - name: hub-lint
      glob: "backend/services/hub/**/*.go"
      run: cd backend/services/hub && golangci-lint run

    - name: hub-fmt
      glob: "backend/services/hub/**/*.go"
      run: cd backend/services/hub && test -z "$(gofumpt -l .)" || (echo "Run 'make fmt' to format code" && exit 1)

    - name: hub-vet
      glob: "backend/services/hub/**/*.go"
      run: cd backend/services/hub && go vet ./...

    - name: module-boundary
      run: make check-boundary

