services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.26-bookworm
    volumes:
      - ../:/workspaces/ava:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devcontainer-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ava_password
      POSTGRES_DB: ava_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ava -d ava_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devcontainer-network

volumes:
  postgres_data:
    driver: local

networks:
  devcontainer-network:
    driver: bridge
